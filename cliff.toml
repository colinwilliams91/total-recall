[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{%- macro remote_url() -%}
  https://github.com/colinwilliams91/total-recall
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - [{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}){% if commit.scope %} **({{ commit.scope }})**{% endif %}: {{ commit.message }}\
    {% endfor %}
{% endfor %}
"""
trim = true
footer = """
---

> **Breaking-change migration (v0.5.0):** the installed executable was renamed
> `tr` -> `torec` to eliminate the collision with the GNU coreutils `tr`
> translate utility (shadowing broke unrelated programs on Linux — shell
> scripts, desktop launchers). To migrate: `go install
> github.com/colinwilliams91/total-recall/cmd/torec@latest`, delete the old
> stale `tr` binary from your PATH, then re-run `torec repo` in each
> repository with hooks installed. There is no `tr` compatibility alias —
> re-installing one deliberately keeps shadowing coreutils.
<!-- generated by git-cliff -->
"""
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/colinwilliams91/total-recall" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^docs", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^Merge ", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
