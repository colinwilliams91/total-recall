# Blocking CI gate: runs the repo-local domain-modeling skill over the PR diff,
# posts found violations as PR feedback, and FAILS the job when there are
# findings or when the audit cannot run. To enforce at the merge queue, require
# the `domain-modeling` job under Settings → Branches → protection rules for
# `main` → required status checks; the job handles its own failure signaling.
#
# Findings are not fixable by robotics: the developer must resolve them (fix the
# glossary, code, or write the ADR, as the finding recommends) and re-run.
#
# Requires one secret: OPENCODE_API_KEY (Settings -> Secrets and variables ->
# Actions). The model below uses the opencode-go subscription provider; change
# `model:` if the provider/model routing changes.
name: Domain model check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  domain-modeling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run OpenCode domain-modeling audit
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/glm-5.3-flash
          use_github_token: true
          prompt: |
            Load the total-recall-domain-modeling skill (the repo-local copy at
            .opencode/skills/total-recall-domain-modeling) via the skill tool, then audit this
            pull request's diff against base branch origin/main:

              git fetch origin main --quiet
              git diff origin/main...HEAD

            Audit only for domain-modeling findings; do not review code quality
            or mechanics. Report as a concise list:

            1. Vocabulary conflicts: diffs whose language contradicts definitions
               or _Avoid_ words in GLOSSARY.md, or that introduce a second name
               for an existing term.
            2. Fuzzy/overloaded terms: vague words the diff relies on that
               GLOSSARY.md should pin, including brand-new terms crystallized
               in this diff (types, tables, flag names, docs) that are missing
               from GLOSSARY.md.
            3. Contradiction with code: diff states how something works and the
               surrounding code or specs disagree.
            4. Missing ADR: a decision in the diff that passes all three house
               tests (hard to reverse, surprising without context, real
               trade-off) with no ADR in docs/adr/ recording it — or an added/
               edited ADR that breaks the house procedure in docs/adr/README.md.

            For each finding give file:line, the violating text, and the
            one-line fix the developer should make. If there are no findings,
            say so in one line and report finding category 1-4 as "none".

            The developer is responsible for making the changes; you must not
            modify any files or commit anything. Findings only.

            The last line of your reply MUST be exactly one of:

              DOMAIN-MODEL-VERDICT: PASS   (no findings at all)
              DOMAIN-MODEL-VERDICT: FAIL   (one or more findings of any kind)

            A downstream automation enforces this verdict; do not omit or
            decorate the marker line.

      - name: Enforce domain-modeling verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          body="$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and .created_at > "${{ github.run_started_at }}")] | sort_by(.created_at) | last | .body' 2>/dev/null || true)"

          if [ -z "${body:-}" ]; then
            echo "No audit comment was posted after this run started; the audit itself likely failed." >&2
            exit 1
          fi

          printf '%s\n' "$body"

          if grep -q 'DOMAIN-MODEL-VERDICT: FAIL' <<<"$body"; then
            echo "::error::Domain-modeling audit found violations (see comment above); resolve them and re-run." >&2
            exit 1
          fi

          if grep -q 'DOMAIN-MODEL-VERDICT: PASS' <<<"$body"; then
            echo 'Audit passed.'
            exit 0
          fi

          echo "Audit comment present but carries no PASS/FAIL verdict marker; treat as inconclusive and refetch or re-run." >&2
          exit 1
